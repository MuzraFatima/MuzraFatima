<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 186" width="880" height="186" role="img" aria-labelledby="t d">
  <title id="t">13-week contribution streak</title>
  <desc id="d">8 of the last 13 weeks had at least one contribution. Filled squares mark active weeks.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071A33"/>
      <stop offset="55%" stop-color="#0B2140"/>
      <stop offset="100%" stop-color="#0E2A4D"/>
    </linearGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#35D6FF" stop-opacity="0"/>
      <stop offset="86%" stop-color="#35D6FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#35D6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="furGrad" cx="36%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#FFFBF2"/>
      <stop offset="58%" stop-color="#FFF0D6"/>
      <stop offset="100%" stop-color="#EDD5AE"/>
    </radialGradient>
    <radialGradient id="tailGrad" cx="30%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFF8EA"/>
      <stop offset="65%" stop-color="#FFF0D6"/>
      <stop offset="100%" stop-color="#E9CFA4"/>
    </radialGradient>
    <radialGradient id="irisGrad" cx="38%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#AEF2FF"/>
      <stop offset="52%" stop-color="#35D6FF"/>
      <stop offset="100%" stop-color="#0E7FAD"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9FB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9FB2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="sparkle" d="M0,-6 Q1.1,-1.1 6,0 Q1.1,1.1 0,6 Q-1.1,1.1 -6,0 Q-1.1,-1.1 0,-6 Z"/>
    <g id="paw">
      <ellipse cx="0" cy="2.6" rx="4.6" ry="3.7"/>
      <ellipse cx="-4.4" cy="-2.6" rx="1.9" ry="2.5"/>
      <ellipse cx="-1.5" cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="1.5" cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="4.4" cy="-2.6" rx="1.9" ry="2.5"/>
    </g>
    <g id="starBadge">
      <path d="M0,-11 L3.2,-3.6 L11,-3.1 L5.1,2 L6.9,9.7 L0,5.6 L-6.9,9.7 L-5.1,2 L-11,-3.1 L-3.2,-3.6 Z"/>
    </g>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .cat { animation: float 4.6s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: 8% 86%; animation: swish 3.4s ease-in-out infinite; }
    .earL { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchL 7s ease-in-out infinite; }
    .earR { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchR 7s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5.8s ease-in-out infinite; }
    .ringDash { animation: spin 26s linear infinite; }
    .glowPulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 4.6s ease-in-out infinite; }
    .breathe { transform-box: fill-box; transform-origin: 50% 90%; animation: breathe 3.8s ease-in-out infinite; }
    .zz { transform-box: fill-box; transform-origin: 50% 100%; animation: zzz 3.4s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: 20% 90%; animation: wave 1.9s ease-in-out infinite; }
    .stA, .stB, .stC { transform-box: fill-box; transform-origin: 50% 50%;
                        animation: twinkle 3.6s ease-in-out infinite; }
    .stB { animation-duration: 4.4s; animation-delay: -1.2s; }
    .stC { animation-duration: 5.2s; animation-delay: -2.4s; }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes swish { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(10deg); } }
    @keyframes blink { 0%,91%,100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } 97% { transform: scaleY(1); } }
    @keyframes twitchL { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(8deg); } 94% { transform: rotate(-3deg); } }
    @keyframes twitchR { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-9deg); } 96% { transform: rotate(3deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes zzz { 0% { opacity: 0; transform: translateY(4px) scale(.8); }
                      35% { opacity: 1; }
                      100% { opacity: 0; transform: translateY(-14px) scale(1.15); } }
    @keyframes wave { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(14deg); } }
    @keyframes twinkle { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } }

    @media (prefers-reduced-motion: reduce) {
      .cat, .tail, .earL, .earR, .eye, .ringDash, .glowPulse,
      .breathe, .zz, .wave, .stA, .stB, .stC { animation: none !important; }
    }
  </style>
  <rect x="0" y="0" width="880" height="186" rx="24" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="877" height="183" rx="22.5" fill="none" stroke="#35D6FF" stroke-opacity="0.22" stroke-width="3"/>
  <text x="36" y="54" fill="#35D6FF" font-size="23" font-weight="700" class="f">13-Week Streak</text>
  <g transform="translate(230,47) scale(0.62)" fill="#FF9FB2" opacity=".9"><use href="#paw"/></g>
  <g transform="translate(249,47) scale(0.62)" fill="#35D6FF" opacity=".9"><use href="#paw"/></g>
  <g transform="translate(268,47) scale(0.62)" fill="#FFD54A" opacity=".9"><use href="#paw"/></g>
  <text x="844" y="54" fill="#FFD54A" font-size="14.5" font-weight="600" text-anchor="end" class="f">8 / 13 weeks active</text>
  <rect x="36" y="80" width="52" height="52" rx="13" fill="#071A33" fill-opacity="1" stroke="#9FB8D6" stroke-opacity="0.3" stroke-width="1.6"/>
  <rect x="99" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(125.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="162" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(188.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="225" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(251.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="288" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(314.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="351" y="80" width="52" height="52" rx="13" fill="#071A33" fill-opacity="1" stroke="#9FB8D6" stroke-opacity="0.3" stroke-width="1.6"/>
  <rect x="414" y="80" width="52" height="52" rx="13" fill="#071A33" fill-opacity="1" stroke="#9FB8D6" stroke-opacity="0.3" stroke-width="1.6"/>
  <rect x="477" y="80" width="52" height="52" rx="13" fill="#071A33" fill-opacity="1" stroke="#9FB8D6" stroke-opacity="0.3" stroke-width="1.6"/>
  <rect x="540" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(566.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="603" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(629.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="666" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(692.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <rect x="729" y="80" width="52" height="52" rx="13" fill="#071A33" fill-opacity="1" stroke="#9FB8D6" stroke-opacity="0.3" stroke-width="1.6"/>
  <rect x="792" y="80" width="52" height="52" rx="13" fill="#35D6FF" fill-opacity="0.85" stroke="#35D6FF" stroke-opacity="0.9" stroke-width="1.6"/>
  <g transform="translate(818.0,106.0) scale(.78)" fill="#071A33" opacity=".75"><use href="#paw"/></g>
  <text x="36" y="162" fill="#9FB8D6" font-size="12.5" font-weight="400" class="f">A week counts when it has at least one contribution.</text>
</svg>
