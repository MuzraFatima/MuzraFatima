<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Code Pet. Muzra Fatima, Aspiring AI/ML Engineer</title>
  <desc id="heroDesc">A fluffy cream cat mascot with big sparkly cyan eyes, pink cheeks, upright ears and a bushy tail, floating inside a glowing cyan ring on a deep navy starfield, beside the heading CODE PET at MuzraFatima, the name Muzra Fatima, and the title Aspiring AI/ML Engineer.</desc>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#071A33"/>
      <stop offset="55%" stop-color="#0B2140"/>
      <stop offset="100%" stop-color="#0E2A4D"/>
    </linearGradient>

    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#35D6FF" stop-opacity="0"/>
      <stop offset="86%" stop-color="#35D6FF" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#35D6FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="furGrad" cx="36%" cy="26%" r="80%">
      <stop offset="0%"  stop-color="#FFFBF2"/>
      <stop offset="58%" stop-color="#FFF0D6"/>
      <stop offset="100%" stop-color="#EDD5AE"/>
    </radialGradient>

    <radialGradient id="tailGrad" cx="30%" cy="30%" r="85%">
      <stop offset="0%"  stop-color="#FFF8EA"/>
      <stop offset="65%" stop-color="#FFF0D6"/>
      <stop offset="100%" stop-color="#E9CFA4"/>
    </radialGradient>

    <radialGradient id="irisGrad" cx="38%" cy="30%" r="74%">
      <stop offset="0%"  stop-color="#AEF2FF"/>
      <stop offset="52%" stop-color="#35D6FF"/>
      <stop offset="100%" stop-color="#0E7FAD"/>
    </radialGradient>

    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FF9FB2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FF9FB2" stop-opacity="0"/>
    </radialGradient>

    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <path id="sparkle" d="M0,-6 Q1.1,-1.1 6,0 Q1.1,1.1 0,6 Q-1.1,1.1 -6,0 Q-1.1,-1.1 0,-6 Z"/>

    <g id="paw">
      <ellipse cx="0" cy="2.6" rx="4.6" ry="3.7"/>
      <ellipse cx="-4.4" cy="-2.6" rx="1.9" ry="2.5"/>
      <ellipse cx="-1.5" cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="1.5"  cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="4.4"  cy="-2.6" rx="1.9" ry="2.5"/>
    </g>
  </defs>

  <style>
    .f { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }

    .cat      { animation: float 4.6s ease-in-out infinite; }
    .tail     { transform-box: fill-box; transform-origin: 8% 86%; animation: swish 3.4s ease-in-out infinite; }
    .earL     { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchL 7s ease-in-out infinite; }
    .earR     { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchR 7s ease-in-out infinite; }
    .eye      { transform-box: fill-box; transform-origin: 50% 50%;  animation: blink 5.8s ease-in-out infinite; }
    .ringDash { transform-origin: 148px 140px; animation: spin 26s linear infinite; }
    .glowPulse{ transform-box: fill-box; transform-origin: 50% 50%;  animation: pulse 4.6s ease-in-out infinite; }

    .stA, .stB, .stC { transform-box: fill-box; transform-origin: 50% 50%;
                       animation: twinkle 3.6s ease-in-out infinite; }
    .stB { animation-duration: 4.4s; animation-delay: -1.2s; }
    .stC { animation-duration: 5.2s; animation-delay: -2.4s; }

    @keyframes float   { 0%,100% { transform: translateY(0); }      50% { transform: translateY(-7px); } }
    @keyframes swish   { 0%,100% { transform: rotate(-8deg); }      50% { transform: rotate(10deg); } }
    @keyframes blink   { 0%,91%,100% { transform: scaleY(1); }      94% { transform: scaleY(0.08); } 97% { transform: scaleY(1); } }
    @keyframes twitchL { 0%,86%,100% { transform: rotate(0); }      90% { transform: rotate(8deg); }  94% { transform: rotate(-3deg); } }
    @keyframes twitchR { 0%,88%,100% { transform: rotate(0); }      92% { transform: rotate(-9deg); } 96% { transform: rotate(3deg); } }
    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes pulse   { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes twinkle { 0%,100% { opacity: .5; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.2); } }

    @media (prefers-reduced-motion: reduce) {
      .cat, .tail, .earL, .earR, .eye, .ringDash, .glowPulse, .stA, .stB, .stC { animation: none !important; }
    }
  </style>

  <rect x="0" y="0" width="880" height="280" rx="28" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="877" height="277" rx="26.5" fill="none" stroke="#35D6FF" stroke-opacity="0.22" stroke-width="3"/>

  <g filter="url(#starGlow)">
    <g transform="translate(330,48) scale(1.05)" fill="#FFF0D6"><g class="stA"><use href="#sparkle"/></g></g>
    <g transform="translate(486,36) scale(0.8)" fill="#35D6FF"><g class="stB"><use href="#sparkle"/></g></g>
    <g transform="translate(664,54) scale(0.95)" fill="#FFD54A"><g class="stC"><use href="#sparkle"/></g></g>
    <g transform="translate(818,92) scale(0.8)" fill="#FFF0D6"><g class="stA"><use href="#sparkle"/></g></g>
    <g transform="translate(842,198) scale(1.0)" fill="#35D6FF"><g class="stB"><use href="#sparkle"/></g></g>
    <g transform="translate(736,240) scale(0.75)" fill="#FFD54A"><g class="stC"><use href="#sparkle"/></g></g>
    <g transform="translate(566,252) scale(0.9)" fill="#FFF0D6"><g class="stA"><use href="#sparkle"/></g></g>
    <g transform="translate(404,236) scale(0.7)" fill="#35D6FF"><g class="stB"><use href="#sparkle"/></g></g>
    <g transform="translate(52,54) scale(0.85)" fill="#FFD54A"><g class="stC"><use href="#sparkle"/></g></g>
    <g transform="translate(44,224) scale(0.95)" fill="#FFF0D6"><g class="stA"><use href="#sparkle"/></g></g>
    <g transform="translate(256,150) scale(0.65)" fill="#35D6FF"><g class="stB"><use href="#sparkle"/></g></g>
    <g transform="translate(272,60) scale(0.6)" fill="#FF9FB2"><g class="stC"><use href="#sparkle"/></g></g>
    <g transform="translate(618,196) scale(0.7)" fill="#FF9FB2"><g class="stA"><use href="#sparkle"/></g></g>
  </g>

  <circle cx="148" cy="140" r="104" fill="url(#ringGlow)" class="glowPulse"/>
  <circle cx="148" cy="140" r="86" fill="#0E2A4D" stroke="#35D6FF" stroke-opacity="0.95" stroke-width="3" filter="url(#softGlow)"/>
  <circle cx="148" cy="140" r="95" fill="none" stroke="#FFD54A" stroke-opacity="0.65" stroke-width="2"
          stroke-dasharray="3 13" stroke-linecap="round" class="ringDash"/>

  <g transform="translate(138,156)">
    <g class="cat">

      <!-- bushy plume tail, behind the body -->
      <g class="tail">
        <path d="M20,30 C44,36 62,28 68,10 C73,-6 66,-20 54,-23 C44,-25 36,-18 36,-9
                 C36,-2 41,3 47,3 C51,3 54,1 55,-3 C57,9 46,19 22,17 Z"
              fill="url(#tailGrad)" stroke="#E4C89E" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M62,-13 C67,-6 66,4 61,10" fill="none" stroke="#E4C89E" stroke-width="1.4" stroke-linecap="round" stroke-opacity=".75"/>
        <path d="M52,-19 C58,-16 61,-10 61,-4" fill="none" stroke="#FFFBF2" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".7"/>
      </g>

      <!-- ears, drawn before the head so their bases tuck under it -->
      <g class="earL">
        <path d="M-33,-48 C-38,-66 -35,-82 -28,-85 C-21,-82 -14,-68 -11,-54 Z"
              fill="url(#furGrad)" stroke="#E4C89E" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M-30,-52 C-33,-65 -30,-75 -26,-77 C-22,-74 -18,-65 -16,-56 Z" fill="#FF9FB2" opacity=".8"/>
      </g>
      <g class="earR">
        <path d="M33,-48 C38,-66 35,-82 28,-85 C21,-82 14,-68 11,-54 Z"
              fill="url(#furGrad)" stroke="#E4C89E" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M30,-52 C33,-65 30,-75 26,-77 C22,-74 18,-65 16,-56 Z" fill="#FF9FB2" opacity=".8"/>
      </g>

      <!-- body -->
      <path d="M-30,22 C-30,2 -16,-10 0,-10 C16,-10 30,2 30,22
               C30,34 24,43 16,46 C12,43 9,46 5,47 C1,48 -3,45 -7,47
               C-12,49 -17,44 -21,45 C-27,42 -30,32 -30,22 Z"
            fill="url(#furGrad)" stroke="#E4C89E" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M-11,14 C-6,22 6,22 11,14 C9,26 -9,26 -11,14 Z" fill="#FFFBF2" opacity=".85"/>

      <ellipse cx="-11" cy="44" rx="8" ry="5.5" fill="#FFFBF2" stroke="#E4C89E" stroke-width="1.4"/>
      <ellipse cx="11"  cy="44" rx="8" ry="5.5" fill="#FFFBF2" stroke="#E4C89E" stroke-width="1.4"/>

      <!-- head -->
      <path d="M0,-62 C19,-62 34,-50 37,-34 C39,-23 38,-13 33,-6
               C28,2 15,7 0,7 C-15,7 -28,2 -33,-6
               C-38,-13 -39,-23 -37,-34 C-34,-50 -19,-62 0,-62 Z"
            fill="url(#furGrad)" stroke="#E4C89E" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M-9,-58 C-5,-66 -1,-67 2,-60 C4,-66 9,-64 10,-58 C5,-61 -3,-61 -9,-58 Z" fill="#FFFBF2"/>

      <ellipse cx="-22" cy="-16" rx="10.5" ry="7.2" fill="url(#cheekGrad)"/>
      <ellipse cx="22"  cy="-16" rx="10.5" ry="7.2" fill="url(#cheekGrad)"/>

      <g class="eye">
        <ellipse cx="-13" cy="-28" rx="8.8" ry="9.8" fill="#071A33"/>
        <ellipse cx="-13" cy="-27" rx="6.8" ry="7.8" fill="url(#irisGrad)"/>
        <circle  cx="-13" cy="-26.5" r="3.5" fill="#06182E"/>
        <circle  cx="-15.7" cy="-30.6" r="2.6" fill="#FFFFFF"/>
        <circle  cx="-10.3" cy="-23.6" r="1.4" fill="#FFFFFF" opacity=".85"/>
      </g>
      <g class="eye">
        <ellipse cx="13" cy="-28" rx="8.8" ry="9.8" fill="#071A33"/>
        <ellipse cx="13" cy="-27" rx="6.8" ry="7.8" fill="url(#irisGrad)"/>
        <circle  cx="13" cy="-26.5" r="3.5" fill="#06182E"/>
        <circle  cx="10.3" cy="-30.6" r="2.6" fill="#FFFFFF"/>
        <circle  cx="15.7" cy="-23.6" r="1.4" fill="#FFFFFF" opacity=".85"/>
      </g>

      <path d="M0,-13 L-3.4,-16.4 L3.4,-16.4 Z" fill="#FF9FB2" stroke="#F08097" stroke-width=".7" stroke-linejoin="round"/>
      <path d="M0,-13 L0,-10 M0,-10 C-2.6,-10 -4.4,-11.6 -4.6,-13.4 M0,-10 C2.6,-10 4.4,-11.6 4.6,-13.4"
            fill="none" stroke="#C9A77C" stroke-width="1.5" stroke-linecap="round"/>

      <g stroke="#FFFBF2" stroke-width="1.6" stroke-linecap="round" opacity=".92" fill="none">
        <path d="M-17,-15 C-28,-18 -37,-18 -46,-16"/>
        <path d="M-17,-10 C-28,-10 -37,-9  -46,-6"/>
        <path d="M17,-15 C28,-18 37,-18 46,-16"/>
        <path d="M17,-10 C28,-10 37,-9  46,-6"/>
      </g>
    </g>
  </g>

  <g class="f">
    <text x="286" y="92" fill="#35D6FF" font-size="15" font-weight="600" letter-spacing="3.4" filter="url(#textGlow)">CODE PET  &#183;  @MuzraFatima</text>
    <text x="284" y="150" fill="#FFFFFF" font-size="46" font-weight="700" letter-spacing="0.4">Muzra Fatima</text>
    <text x="286" y="188" fill="#FFD54A" font-size="21" font-weight="500" letter-spacing="0.6">Aspiring AI/ML Engineer</text>
  </g>

  <g fill="#FF9FB2" opacity=".9">
    <g transform="translate(292,214) scale(.9)"><use href="#paw"/></g>
    <g transform="translate(320,214) scale(.9)" fill="#35D6FF"><use href="#paw"/></g>
    <g transform="translate(348,214) scale(.9)" fill="#FFD54A"><use href="#paw"/></g>
  </g>
  <line x1="372" y1="213" x2="828" y2="213" stroke="#9FB8D6" stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
</svg>
