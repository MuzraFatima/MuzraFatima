<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 306" width="880" height="306" role="img" aria-labelledby="t d">
  <title id="t">About Muzra Fatima</title>
  <desc id="d">A small cream cat sitting beside a card that reads: Final-year B.Tech student in Artificial Intelligence &amp; Machine Learning, based in Telangana, India. I build LLM-powered multi-agent systems, cost-aware model routing and mechanistic interpretability tooling - then measure whether they actually work.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#080A11"/>
      <stop offset="55%" stop-color="#0A1520"/>
      <stop offset="100%" stop-color="#0C2234"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#35D6FF"/>
      <stop offset="55%" stop-color="#7FE4FF"/>
      <stop offset="100%" stop-color="#FFD54A"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#0E6E9E" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0E6E9E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringGlow" cx="50%" cy="50%" r="50%">
      <stop offset="58%" stop-color="#35D6FF" stop-opacity="0"/>
      <stop offset="86%" stop-color="#35D6FF" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#35D6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="furGrad" cx="34%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#7FD9FB"/>
      <stop offset="58%" stop-color="#45BCF0"/>
      <stop offset="100%" stop-color="#1F93CC"/>
    </radialGradient>
    <radialGradient id="bellyGrad" cx="50%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D6F2FE"/>
    </radialGradient>
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9FB2" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FF9FB2" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="sparkle" d="M0,-6 Q1.1,-1.1 6,0 Q1.1,1.1 0,6 Q-1.1,1.1 -6,0 Q-1.1,-1.1 0,-6 Z"/>
    <g id="paw">
      <ellipse cx="0" cy="2.6" rx="4.6" ry="3.7"/>
      <ellipse cx="-4.4" cy="-2.6" rx="1.9" ry="2.5"/>
      <ellipse cx="-1.5" cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="1.5" cy="-4.4" rx="1.9" ry="2.5"/>
      <ellipse cx="4.4" cy="-2.6" rx="1.9" ry="2.5"/>
    </g>
    <g id="starBadge">
      <path d="M0,-11 L3.2,-3.6 L11,-3.1 L5.1,2 L6.9,9.7 L0,5.6 L-6.9,9.7 L-5.1,2 L-11,-3.1 L-3.2,-3.6 Z"/>
    </g>
  </defs>
  <style>
    .f { font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .m { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .cat { animation: float 4.6s ease-in-out infinite; }
    .tail { transform-box: fill-box; transform-origin: 10% 85%; animation: swish 3.4s ease-in-out infinite; }
    .earL { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchL 7s ease-in-out infinite; }
    .earR { transform-box: fill-box; transform-origin: 50% 100%; animation: twitchR 7s ease-in-out infinite; }
    .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 5.8s ease-in-out infinite; }
    .ringDash { animation: spin 30s linear infinite; }
    .ringDot { animation: spin 22s linear infinite; }
    .glowPulse { transform-box: fill-box; transform-origin: 50% 50%; animation: pulse 4.6s ease-in-out infinite; }
    .breathe { transform-box: fill-box; transform-origin: 50% 90%; animation: breathe 3.8s ease-in-out infinite; }
    .zz { transform-box: fill-box; transform-origin: 50% 100%; animation: zzz 3.4s ease-in-out infinite; }
    .wave { transform-box: fill-box; transform-origin: 22% 88%; animation: wave 1.9s ease-in-out infinite; }
    .stA, .stB, .stC { transform-box: fill-box; transform-origin: 50% 50%;
                        animation: twinkle 3.6s ease-in-out infinite; }
    .stB { animation-duration: 4.4s; animation-delay: -1.2s; }
    .stC { animation-duration: 5.2s; animation-delay: -2.4s; }

    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes swish { 0%,100% { transform: rotate(-9deg); } 50% { transform: rotate(11deg); } }
    @keyframes blink { 0%,91%,100% { transform: scaleY(1); } 94% { transform: scaleY(0.08); } 97% { transform: scaleY(1); } }
    @keyframes twitchL { 0%,86%,100% { transform: rotate(0); } 90% { transform: rotate(8deg); } 94% { transform: rotate(-3deg); } }
    @keyframes twitchR { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-9deg); } 96% { transform: rotate(3deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.05); } }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @keyframes zzz { 0% { opacity: 0; transform: translateY(4px) scale(.8); }
                      35% { opacity: 1; }
                      100% { opacity: 0; transform: translateY(-14px) scale(1.15); } }
    @keyframes wave { 0%,100% { transform: rotate(-18deg); } 50% { transform: rotate(12deg); } }
    @keyframes twinkle { 0%,100% { opacity: .45; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.2); } }

    @media (prefers-reduced-motion: reduce) {
      .cat, .tail, .earL, .earR, .eye, .ringDash, .ringDot, .glowPulse,
      .breathe, .zz, .wave, .stA, .stB, .stC { animation: none !important; }
    }
  </style>
  <rect x="0" y="0" width="880" height="306" rx="24" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="878" height="304" rx="23" fill="none" stroke="#35D6FF" stroke-opacity="0.10" stroke-width="2"/>
  <g filter="url(#starGlow)">

  </g>
  <rect x="176" y="26" width="678" height="254" rx="18" fill="#0A1620" stroke="#35D6FF" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(92,167.0) scale(0.62)">
    <g class="cat">
      <g class="earL">
        <path d="M-40,-24 C-46,-44 -40,-57 -30,-56 C-23,-54 -18,-43 -15,-32 Z"
              fill="#45BCF0" stroke="#1878A8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M-36,-29 C-40,-42 -35,-50 -30,-49 C-26,-47 -23,-40 -21,-34 Z"
              fill="#7FD9FB" opacity=".95"/>
      </g>
      <g class="earR">
        <path d="M40,-24 C46,-44 40,-57 30,-56 C23,-54 18,-43 15,-32 Z"
              fill="#45BCF0" stroke="#1878A8" stroke-width="2" stroke-linejoin="round"/>
        <path d="M36,-29 C40,-42 35,-50 30,-49 C26,-47 23,-40 21,-34 Z"
              fill="#7FD9FB" opacity=".95"/>
      </g>
      <ellipse cx="0" cy="48" rx="40" ry="8" fill="#031120" opacity=".45"/>
      <path d="M0,-44 C31,-44 53,-24 53,2 C53,28 33,47 0,47
                C-33,47 -53,28 -53,2 C-53,-24 -31,-44 0,-44 Z"
            fill="url(#furGrad)" stroke="#1878A8" stroke-width="2.2" stroke-linejoin="round"/>
      <ellipse cx="-18" cy="-20" rx="16" ry="11" fill="#FFFFFF" opacity=".16"/>
      <g class="eye">
        <ellipse cx="-17" cy="-7" rx="11" ry="12.5" fill="#FFFFFF"/>
        <ellipse cx="-17" cy="-6" rx="6.6" ry="7.8" fill="#0B2B42"/>
        <circle cx="-19.6" cy="-10.2" r="3.1" fill="#FFFFFF"/>
        <circle cx="-14.0" cy="-1.8" r="1.6" fill="#FFFFFF" opacity=".9"/>
      </g>
      <g class="eye">
        <ellipse cx="17" cy="-7" rx="11" ry="12.5" fill="#FFFFFF"/>
        <ellipse cx="17" cy="-6" rx="6.6" ry="7.8" fill="#0B2B42"/>
        <circle cx="14.4" cy="-10.2" r="3.1" fill="#FFFFFF"/>
        <circle cx="20.0" cy="-1.8" r="1.6" fill="#FFFFFF" opacity=".9"/>
      </g>
      <ellipse cx="-31" cy="9" rx="11" ry="7" fill="url(#cheekGrad)"/>
      <ellipse cx="31" cy="9" rx="11" ry="7" fill="url(#cheekGrad)"/>
      <path d="M-7,10 C-4,14.5 4,14.5 7,10" fill="none" stroke="#1878A8"
            stroke-width="2.2" stroke-linecap="round"/>
      <ellipse cx="-17" cy="45" rx="10" ry="6" fill="#45BCF0"
               stroke="#1878A8" stroke-width="1.6"/>
      <ellipse cx="17" cy="45" rx="10" ry="6" fill="#45BCF0"
               stroke="#1878A8" stroke-width="1.6"/>
    </g>
  </g>
  <text x="206" y="64" fill="#35D6FF" font-size="23" font-weight="700" class="f">About Me</text>
  <g transform="translate(330,57) scale(0.62)" fill="#FF9FB2" opacity=".9"><use href="#paw"/></g>
  <g transform="translate(349,57) scale(0.62)" fill="#35D6FF" opacity=".9"><use href="#paw"/></g>
  <g transform="translate(368,57) scale(0.62)" fill="#FFD54A" opacity=".9"><use href="#paw"/></g>
  <text x="206" y="100" fill="#FFFFFF" font-size="15" font-weight="400" class="f">Final-year B.Tech student in Artificial Intelligence &amp; Machine Learning,</text>
  <text x="206" y="125" fill="#FFFFFF" font-size="15" font-weight="400" class="f">based in Telangana, India. I build LLM-powered multi-agent systems,</text>
  <text x="206" y="150" fill="#FFFFFF" font-size="15" font-weight="400" class="f">cost-aware model routing and mechanistic interpretability tooling</text>
  <text x="206" y="175" fill="#9FB8D6" font-size="15" font-weight="400" class="f">- then measure whether they actually work.</text>
  <g>
    <rect x="206.0" y="192" width="272.7" height="30" rx="15.0" fill="#35D6FF" fill-opacity="0.13" stroke="#35D6FF" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="342.4" y="211.6" fill="#35D6FF" font-size="13.5" font-weight="600" text-anchor="middle" class="f">Research-grade repos, not demos</text>
  </g>
  <g>
    <rect x="486.7" y="192" width="202.3" height="30" rx="15.0" fill="#FFD54A" fill-opacity="0.13" stroke="#FFD54A" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="587.9" y="211.6" fill="#FFD54A" font-size="13.5" font-weight="600" text-anchor="middle" class="f">Agents &amp; orchestration</text>
  </g>
  <g>
    <rect x="206.0" y="226" width="280.6" height="30" rx="15.0" fill="#35D6FF" fill-opacity="0.13" stroke="#35D6FF" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="346.3" y="245.6" fill="#35D6FF" font-size="13.5" font-weight="600" text-anchor="middle" class="f">Interpretability &amp; LLM internals</text>
  </g>
  <g>
    <rect x="494.6" y="226" width="155.3" height="30" rx="15.0" fill="#FFD54A" fill-opacity="0.13" stroke="#FFD54A" stroke-opacity="0.75" stroke-width="1.4"/>
    <text x="572.2" y="245.6" fill="#FFD54A" font-size="13.5" font-weight="600" text-anchor="middle" class="f">Systems that run</text>
  </g>
</svg>
